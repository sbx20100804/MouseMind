name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore MouseMind.slnx
      - name: Build
        run: dotnet build MouseMind.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test MouseMind.slnx --configuration Release --no-build --logger "trx;LogFileName=mousemind-tests.trx"
